<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 860" id="p1PinMatrix"><title>QSSC P1 pin-scaffold: 64-hole matrix + cross-section</title><desc>Top view of the 8x8 = 64-hole pin-array support circle-bored by p1_pin_array_support.gcode (2.54 mm pitch, 1.5 mm holes), plus a cross-section of the detector (pin-molded graphene/MoS2+PEDOT paste) and the emitter (pin-molded CQD paste, symmetric to the detector). Rendered directly from the real gcode.</desc><text x="650" y="34" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">QSSC-P1  PIN-HEADER SCAFFOLD  (8x8 = 64 pins, 2.54 mm pitch)</text><text x="650" y="56" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333">top view of the CNC 64-hole matrix (rendered from the real gcode) + cross-section of the two devices</text><rect x="40" y="90" width="620" height="620" rx="6" fill="#f7f7f4" stroke="#ddd" /><text x="50" y="112" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111">A. PIN-ARRAY SUPPORT  (top view, 20x20x3 mm)</text><text x="50" y="130" font-family="sans-serif" font-size="11" fill="#333">8x8 = 64 holes, 2.54 mm pitch (standard pin header), 1.5 mm dia, centred (first pin 1.11 mm). 1 mm bit CIRCLE-BORES each (visible polygon circle, no G02).</text><rect x="60.0" y="150.0" width="560.0" height="560.0" rx="4" fill="#3a6146" fill-opacity="0.18" stroke="#92501a" stroke-width="2" /><circle cx="91.08" cy="181.08" r="21.0" fill="#fff" stroke="#1b1b1b" stroke-width="1.1" /><circle cx="162.2" cy="181.08" r="21.0" fill="#fff" stroke="#1b1b1b" stroke-width="1.1" /><circle cx="233.32000000000002" cy="181.08" r="21.0" fill="#fff" stroke="#1b1b1b" stroke-width="1.1" /><circle cx="304.44" cy="181.08" r="21.0" fill="#fff" stroke="#1b1b1b" stroke-width="1.1" /><circle cx="375.56" cy="181.08" r="21.0" fill="#fff" stroke="#1b1b1b" stroke-width="1.1" /><circle cx="446.68" cy="181.08" r="21.0" fill="#fff" stroke="#1b1b1b" stroke-width="1.1" /><circle 