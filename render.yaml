# Render Blueprint for the QSSC API (free web service, Docker runtime).
# autoDeploy is OFF: pushes do NOT trigger a Render deploy. Deploys are gated on
# CI green by the GitHub Actions `deploy.yml` workflow, which fires Render's
# deploy hook only after the ci.yml workflow succeeds (or on a manual
# workflow_dispatch that first re-checks CI). This avoids the auto-deploy / CI
# race where a broken push ships before tests finish. No Redis/Mongo required:
# api/jobs.py falls back to an in-process executor when those services are
# absent. Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: qssc-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Narrow CORS to the dashboard origin (the GitHub Pages site). Comma-list
      # if you serve the dashboard from more than one origin. Leave as "*" only
      # for local dev. Override at deploy time if the Pages URL changes.
      - key: QSSC_CORS_ORIGINS
        value: https://vabismo.github.io
      # Keep the custom-circuit endpoint functional (capped at 12 qubits /
      # 4096 shots by the request models). Set to "0" to hard-disable it on a
      # hardened public deploy; set QSSC_CUSTOM_API_KEY to require an X-API-Key.
      - key: QSSC_ENABLE_CUSTOM_CIRCUIT
        value: "1"