# Deploy — fires ONLY after the CI workflow has completed successfully on main.
# (Gated on tests: a red CI run never reaches this workflow.)
#
# Frontend (static React dashboard) -> GitHub Pages (build_type=workflow;
#   https://vabismo.github.io/QSSC/). Pages was enabled on this repo via
#   Settings -> Pages -> Source = GitHub Actions, so the job below publishes
#   with actions/deploy-pages rather than a gh-pages branch.
# API (FastAPI + qiskit/aer, Docker) -> Render free web service, triggered via
#   Render's deploy hook so the deploy happens after CI is green, not on every
#   push.
#
# Required repo configuration (Settings → Secrets/Variables):
#   * Repository variable VITE_API_BASE = the public API URL, e.g.
#     https://qssc-api.onrender.com  (the dashboard calls this for /api/*;
#     without it the built app falls back to same-origin and every API call
#     404s on Pages).
#   * Repository secret RENDER_DEPLOY_HOOK_URL = Render's deploy-hook URL
#     (Render dashboard → the qssc-api service → Settings → Deploy Hook).
#     If unset, the API deploy step is skipped (the frontend still deploys).
name: Deploy

on:
  # Auto: fires after the CI workflow completes successfully on main (test-gated).
  # Note: GitHub does NOT always re-emit `workflow_run` when a run is manually
  # re-run, so for a one-off manual publish use the "Run workflow" button below
  # (workflow_dispatch). The require-green-ci job below re-checks that CI is
  # green on main before anything deploys, so a manual dispatch can no longer
  # ship a red-CI commit.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual: Actions tab → "Deploy" → "Run workflow". Use this to (re)trigger the
  # Render deploy on demand.
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # Gate every deploy on a green CI run on main. The workflow_run path is
  # already gated by its `if` (conclusion == success); this job covers the
  # workflow_dispatch path, which used to deploy regardless of CI state.
  require-green-ci:
    name: Require green CI on main
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        name: Verify latest CI run on main is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CONC="${{ github.event.workflow_run.conclusion }}"
            echo "workflow_run conclusion: $CONC"
            if [ "$CONC" = "cancelled" ]; then
              # A cancelled CI run (typically a newer push superseded it) is not
              # an error -- there is simply nothing new to deploy. Skip
              # gracefully so the Deploy workflow doesn't show a red X for a
              # benign supersede; the newer push's own CI will re-trigger Deploy.
              echo "::notice::triggering CI run was cancelled (superseded) -- skipping deploy, no error."
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            elif [ "$CONC" != "success" ]; then
              echo "::error::CI run that triggered this deploy was not success ($CONC)"
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            # workflow_dispatch: query the latest CI workflow run on main.
            REPO="${{ github.repository }}"
            # find the CI workflow id (file ci.yml)
            WF_ID=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/$REPO/actions/workflows" \
                    | jq -r '.workflows[] | select(.path | endswith("ci.yml")) | .id' | head -n1)
            if [ -z "$WF_ID" ]; then
              echo "::error::could not find the ci.yml workflow"
              echo "ok=false" >> "$GITHUB_OUTPUT"; exit 1
            fi
            RUN=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                       -H "Accept: application/vnd.github+json" \
                       "https://api.github.com/repos/$REPO/actions/workflows/$WF_ID/runs?branch=main&per_page=1")
            STATUS=$(echo "$RUN" | jq -r '.workflow_runs[0].status')
            CONC=$(echo "$RUN" | jq -r '.workflow_runs[0].conclusion')
            SHA=$(echo "$RUN" | jq -r '.workflow_runs[0].head_sha')
            echo "latest CI run on main: status=$STATUS conclusion=$CONC sha=$SHA"
            if [ "$STATUS" != "completed" ] || [ "$CONC" != "success" ]; then
              echo "::error::latest CI on main is not green (status=$STATUS conclusion=$CONC). Re-run CI before deploying."
              echo "ok=false" >> "$GITHUB_OUTPUT"; exit 1
            fi
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  # Publish the dashboard to GitHub Pages. Job-level permissions: the rest of
  # the workflow stays read-only, and only this job gets what the Pages OIDC
  # deploy needs (id-token for the signed artifact upload, pages to publish).
  deploy-frontend:
    name: Frontend → GitHub Pages
    needs: require-green-ci
    if: ${{ needs.require-green-ci.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build dashboard (API base = VITE_API_BASE)
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
      - id: deploy
        uses: actions/deploy-pages@v5

  # Manual only. This job used to run after every green CI on main, and with
  # RENDER_DEPLOY_HOOK_URL unset each of those runs came back red for a deploy
  # nobody asked for -- pushes never ship anyway (render.yaml sets
  # autoDeploy: false), so the hook is fired on demand instead:
  # Actions -> Deploy -> Run workflow. The dashboard keeps publishing itself
  # through deploy-frontend above.
  deploy-api:
    name: API → Render (deploy hook)
    needs: require-green-ci
    if: ${{ github.event_name == 'workflow_dispatch' && needs.require-green-ci.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook (test-gated)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error title=API not deployed::RENDER_DEPLOY_HOOK_URL is not set, so the API was NOT redeployed. render.yaml sets autoDeploy: false on purpose (pushes must not ship before CI is green), which makes this hook the only thing that ever updates the service. With it missing, Render keeps serving the last built image while main moves on, and the dashboard then calls endpoints that build does not have (404 from GitHub Pages). Fix: Render dashboard -> qssc-api -> Settings -> Deploy Hook -> copy the URL into GitHub Settings -> Secrets and variables -> Actions -> RENDER_DEPLOY_HOOK_URL."
            exit 1
          fi
          echo "Triggering Render deploy hook..."
          curl -fsS -X POST "$HOOK"
          echo "Render deploy triggered for commit of the latest green main."