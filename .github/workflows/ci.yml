# Continuous Integration — QSSC
# Runs the Python test suite across supported versions, lints the codebase,
# smoke-tests the CLI, and builds the frontend dashboard.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Python test matrix
  # ──────────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (api + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Run tests with coverage
        run: pytest --cov=qssc --cov=api --cov-report=term --cov-report=xml

      - name: CLI smoke test
        run: |
          qssc info
          qssc odmr --profile hBN-VB
          qssc odmr --profile NV

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # Lint — fatal errors + undefined names only (blocks CI)
  # ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # E9 = syntax errors, F = pyflakes (undefined names, unused imports, redefs).
      # F401 = unused imports, F841 = unused local variables. Broadened from the
      # fatal-only set (E9,F63,F7,F82) so CI also catches dead imports/locals
      # that accumulate during refactors; all flagged items are auto-fixable.
      - name: ruff check
        run: ruff check --select=E9,F63,F7,F82,F401,F841 .

  # ──────────────────────────────────────────────────────────────────────
  # FPGA RTL — parse-verify (pyverilog) + functional simulate (iverilog)
  # ──────────────────────────────────────────────────────────────────────
  fpga:
    name: FPGA RTL (parse + simulate + synth)
    runs-on: ubuntu-latest
    env:
      # Pinned oss-cad-suite release that provides yosys for the synth step.
      OSS_CAD_SUITE_TAG: "2026-08-26"
    steps:
      - uses: actions/checkout@v4
      - name: Install iverilog + pyverilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install pyverilog
      - name: pyverilog parse all RTL modules
        run: |
          set -e
          for f in fpga/rtl/*.v; do
            python -c "from pyverilog.vparser.parser import VerilogParser as P; p=P(); p.parse(open('$f').read(),'')" || { echo "PARSE FAIL: $f"; exit 1; }
            echo "OK  $f"
          done
      - name: XDC <-> top_level.v port consistency
        run: python3 tools/check_xdc_ports.py
      - name: iverilog functional simulation (self-checking testbench)
        run: |
          cd fpga
          iverilog -g2012 -o /tmp/qssc_tb.vvp -s tb_top_level rtl/*.v sim/tb_top_level.v
          vvp /tmp/qssc_tb.vvp | tee /tmp/sim.log
          grep -q "ALL CHECKS PASSED" /tmp/sim.log
      - name: Cache oss-cad-suite (yosys)
        id: ocs-cache
        uses: actions/cache@v4
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-${{ env.OSS_CAD_SUITE_TAG }}
      - name: Install oss-cad-suite (yosys)
        if: steps.ocs-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          tag="${OSS_CAD_SUITE_TAG}"
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${tag}/oss-cad-suite-linux-x64-${tag//-/}.tgz"
          curl -fL -o /tmp/ocs.tgz "$url"
          tar xzf /tmp/ocs.tgz -C "$HOME"
          rm -f /tmp/ocs.tgz
      - name: yosys synth_xilinx (synthesizability + resource fit, xc7)
        run: |
          set -e
          bash fpga/synth/run_synth.sh
          # Gate: synthesis must reach the COMPLETE banner, infer no latches,
          # map no blackboxes, and the report must say it fits the XC7A35T.
          grep -q "synth_xilinx COMPLETE" fpga/synth/synth.log
          ! grep -qi "inferred latch" fpga/synth/synth.log
          grep -q "Fits XC7A35T.*yes" fpga/synth/SYNTH_REPORT.md

  # ──────────────────────────────────────────────────────────────────────
  # Frontend dashboard build
  # ──────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload dashboard dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error